# 파드로 들어오는 연결은 게이트웨이 포트(8080)만 받는다(D-129 리뷰). 탐지 사이드카(8081)는 인증이 없고 0.0.0.0에서 듣는다 —
# 이 정책이 없으면 같은 클러스터의 다른 파드가 파드 IP:8081로 닿는다. NetworkPolicy를 집행하는 CNI(Calico·Cilium 등)가 있어야 효과가 있다.
# 헬스체크(kubelet)는 노드에서 오므로 대부분의 CNI에서 이 정책과 무관하게 통한다. 나가는 연결(공급자)은 막지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-security-gateway
  labels:
    app.kubernetes.io/name: llm-security-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: llm-security-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
