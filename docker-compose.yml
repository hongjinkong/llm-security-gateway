services:
  target-app:
    image: mintplexlabs/anythingllm@sha256:9a87bca983e688db2a11a0ed3290daa16c4b67556617ae77325c9d12c6a37c25
    container_name: target-anythingllm
    ports:
      - "8000:3001"
    environment:
      - STORAGE_DIR=/app/server/storage
      - LLM_PROVIDER=${ANYTHINGLLM_LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_PATH=http://host.docker.internal:11434
      - OLLAMA_MODEL_PREF=gemma3:4b
      - OLLAMA_MODEL_TOKEN_LIMIT=4096
      # B2: AnythingLLM Generic OpenAI → gateway → 로컬 Ollama.
      - GENERIC_OPEN_AI_BASE_PATH=http://gateway:8080/v1
      - GENERIC_OPEN_AI_MODEL_PREF=${ANYTHINGLLM_MODEL:-gemma3:4b}
      - GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT=4096
      - GENERIC_OPEN_AI_API_KEY=local-only
      # 고정 이미지의 Agent는 OPENAI, 일반 채팅은 OPEN_AI 키를 읽는다(D-076).
      - GENERIC_OPENAI_STREAMING_DISABLED=true
      - GENERIC_OPEN_AI_STREAMING_DISABLED=true
      - EMBEDDING_ENGINE=ollama
      - EMBEDDING_BASE_PATH=http://host.docker.internal:11434
      - EMBEDDING_MODEL_PREF=bge-m3:latest
      - VECTOR_DB=lancedb
    volumes:
      - ./target/storage:/app/server/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: llm-gateway
    ports:
      - "8080:8080"
    environment:
      # 기본은 compose의 target-app. B2에서만 호스트 Ollama로 전환한다.
      - TARGET_URL=${GATEWAY_TARGET_URL:-http://target-app:3001}
      # EVAL 5.2 증분 측정의 손잡이. 이 값만 바꿔가며 같은 측정을 반복한다.
      #   (빈 값) → 검사기 없음   pii → 탐지만   pii_mask → 마스킹+복원
      #   injection_rule → 5단계 1차 룰(이력까지 전부 본다)
      #   injection_rule_turn → 같은 룰, 막을지는 이번 턴만 보고 이력의 걸린 턴은 가린다(D-095·D-099)
      #   canary_observe → 6단계 카나리 관측. 응답을 바꾸지 않는다(D-058)
      #                    **반드시 목록 맨 뒤**여야 한다(응답 경로 맨 앞 = 타겟 원본).
      #                    아니면 게이트웨이가 기동하지 않는다.
      # 2차 유사도·3차 Judge는 기각됐고 코드는 v1 태그에만 있다(D-052·D-054·D-099).
      - GATEWAY_DETECTORS=${GATEWAY_DETECTORS:-}
      - GATEWAY_LOG_PATH=/logs/gateway.jsonl
      # 6단계 카나리 관측(D-058 / CANARY_DESIGN 3-2). 값의 단일 출처는 .env다 —
      # eval/setup_target.py가 타겟에 심을 때 읽는 그 파일, 그 키다(R1).
      #
      # 값이 없으면 빈 값으로 넘긴다(D-099). 예전에는 `:?`로 compose 자체를 죽였는데,
      # 그러면 새로 클론한 저장소에서 카나리를 쓰지 않는 구성도 `docker compose up`이 실패했다.
      # 빈 값으로 관측이 도는 사고는 게이트웨이 안에서 그대로 막힌다 — canary_observe가
      # 켜져 있는데 값이 없으면 prepare()가 RuntimeError로 기동을 실패시킨다.
      - GATEWAY_CANARY_A=${CANARY_A_TOKEN:-}
      - GATEWAY_CANARY_B=${CANARY_B_TOKEN:-}
      - GATEWAY_CANARY_DOC=${DOC_CANARY_TOKEN:-}
    volumes:
      - ./logs:/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - target-app
    healthcheck:
      # /__gateway/health는 감사 로그에서 제외되므로 지연 통계를 오염시키지 않는다.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/__gateway/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
