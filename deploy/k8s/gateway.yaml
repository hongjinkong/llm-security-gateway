# 게이트웨이 Deployment·Service·PodDisruptionBudget(D-121). ConfigMap(gateway.toml)과 Secret(secret.env)은 kustomization.yaml이 만든다.
# 파드마다 탐지 사이드카 컨테이너(detect, D-126)가 함께 돈다 — 이름·주소 가림을 켠 정책이 쓴다. 쓰지 않으면 그 컨테이너와 GATEWAY_DETECT_URL, 그리고 gateway.toml의 [policies.names]를
# 함께 지운다 — 정책에 person·address가 남아 있으면 게이트웨이가 기동하지 않는다(어느 클라이언트가 그 정책을 쓰는지와 무관하다).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-security-gateway
  labels:
    app.kubernetes.io/name: llm-security-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-security-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-security-gateway
    spec:
      # preStop 5초(Service 엔드포인트에서 빠질 시간) + uvicorn 종료 유예 25초(진행 중인 스트림, Dockerfile CMD) + 여유 5초 —
      # uvicorn이 25초에 남은 스트림을 끊은 뒤 상류를 닫고 감사 줄을 쓸 시간이다. 여유가 없으면 그 전에 SIGKILL이다
      terminationGracePeriodSeconds: 35
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: llm-security-gateway
      containers:
        - name: gateway
          # 20단계 릴리스가 올리는 주소다. 그 전에는 직접 빌드해 올린 이미지 주소로 바꾼다(docs/operations.md).
          image: ghcr.io/hongjinkong/llm-security-gateway:0.1.0
          # 워커는 1(WEB_CONCURRENCY 기본) — 지표·레이트리밋·볼트 상한이 프로세스 단위라 파드 수로 늘린다.
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GATEWAY_CONFIG
              value: /etc/llm-security-gateway/gateway.toml
            # 같은 파드의 탐지 사이드카(아래 detect 컨테이너). 인증이 없으므로 파드 밖으로 열지 않는다
            - name: GATEWAY_DETECT_URL
              value: http://127.0.0.1:8081
            # 같은 사이드카의 인젝션 분류기를 가드레일 웹훅으로(D-127) — 켜고 끄는 것은 gateway.toml의 정책 키 guard(기본 off, 사이드카에 분류기를 실어야 한다)
            - name: GATEWAY_GUARD_URL
              value: http://127.0.0.1:8081/v1/guard
            # 쉬는 연결을 75초 붙잡는다(uvicorn 기본 5초) — 인그레스·LB의 유휴 시간(ingress-nginx·AWS ALB 60초)보다 짧으면
            # LB가 게이트웨이가 막 닫은 연결로 POST를 보내 502가 난다. LB 없이 클라이언트를 직접 받으면 기본값이 낫다(D-122).
            - name: UVICORN_TIMEOUT_KEEP_ALIVE
              value: "75"
          envFrom:
            - secretRef:
                name: llm-security-gateway
          readinessProbe:
            httpGet:
              path: /__gateway/health
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # 잠정값: 유휴 36MiB, 1MiB 요청 동시 50건에서 최대 256MiB(docs/operations.md '용량')
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/llm-security-gateway
              readOnly: true
        - name: detect
          # 탐지 사이드카(detect/Dockerfile — 모델은 빌드 때 받아 이미지 안에 있다). 20단계 릴리스가 올리는 주소다. 그 전에는 직접 빌드해 올린 주소로 바꾼다
          image: ghcr.io/hongjinkong/llm-security-gateway-detect:0.1.0
          ports:
            - name: detect
              containerPort: 8081
          # 파드는 게이트웨이와 사이드카가 다 준비돼야 Ready다 — 모델을 여는 데 몇 초 걸린다
          readinessProbe:
            httpGet:
              path: /health
              port: detect
            periodSeconds: 5
          # 인젝션 분류기(가드레일 웹훅, D-127)는 이미지에 있지만 싣지 않는다. 켜려면 아래 env의 주석을 풀고 메모리를 요청 2Gi·상한 3Gi로 올린다
          # (NER + 분류기 — M2 물리 점유 기동 직후 1.8GiB, 모델을 여는 동안 최대 2.6GiB), gateway.toml의 guard = "observe"
          # env:
          #   - name: DETECT_INJECTION_MODEL
          #     value: horizon-guard-base-int8
          # 잠정값(NER만): 모델 143MB + ONNX 런타임 — M2에서 기동 직후 물리 점유 약 590MiB, 요청 뒤 약 620MiB(D-126 §6), 한 번에 추론 하나(스레드 4)
          resources:
            requests:
              cpu: "1"
              memory: 768Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: llm-security-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: llm-security-gateway
  labels:
    app.kubernetes.io/name: llm-security-gateway
spec:
  selector:
    app.kubernetes.io/name: llm-security-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-security-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-security-gateway
