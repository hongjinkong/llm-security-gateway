# D-108: 설치 → lint → 타입 검사(D-118) → 테스트, 그리고 이미지 빌드와 배포 견본 검사(D-121). 액션은 커밋 SHA로 고정한다(태그는 옮겨질 수 있다). 옆의 주석은 확인 당시의 태그다.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q -rs   # 건너뛴 테스트의 사유를 찍는다(W7의 화면 확인 — Chrome을 띄우지 못하면 건너뜀, D-124)

  # 비밀 검사(D-130): 푸시·PR 범위의 커밋만 본다 — 손으로 돌리면(workflow_dispatch) 전체 히스토리를 훑으므로 뺀다. 허용 목록은 .gitleaks.toml
  # 푸시에서는 머지 커밋과 그 둘째 부모 쪽 커밋을 건너뛴다(gitleaks-action의 --no-merges --first-parent) — 그쪽은 PR 이벤트가 본다
  secrets:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read   # PR의 커밋 목록
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # 범위의 커밋을 읽는다
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3   # .gitleaks.toml을 맞춘 버전
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f gateway/Dockerfile .
      # 배포 견본(D-121): compose 문법, kustomize 렌더(견본 비밀로), k8s 스키마(오프라인, --strict). 클러스터는 없다
      - run: docker compose -f deploy/compose.yml config -q
      - run: cp deploy/k8s/secret.env.example deploy/k8s/secret.env && kubectl kustomize deploy/k8s > rendered.yaml
      - run: pipx run --spec kubernetes-validate==1.37.0 kubernetes-validate --strict rendered.yaml
